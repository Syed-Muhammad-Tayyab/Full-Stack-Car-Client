name: CI – Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CI: false
          REACT_APP_API_KEY: ci-placeholder
          REACT_APP_AUTH_DOMAIN: ci-placeholder
          REACT_APP_PROJECT_ID: ci-placeholder
          REACT_APP_STORAGE_BUCKET: ci-placeholder
          REACT_APP_MESSAGING_SENDER_ID: ci-placeholder
          REACT_APP_APP_ID: ci-placeholder
